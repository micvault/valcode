<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VAL Code • Bind Lineups</title>
  <style>
    :root {
      --bg-deep: #2a1b3d;
      --bg-mid: #44318d;
      --accent: #d83f87;
      --warm: #e98074;
      --cool: #a4b3b6;
      --text: #f7f4fb;
      --muted: #d8d0e4;
      --panel: rgba(255, 255, 255, 0.08);
      --border: rgba(255, 255, 255, 0.16);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Inter, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      background:
        linear-gradient(130deg, rgba(42, 27, 61, 0.98), rgba(68, 49, 141, 0.9)),
        radial-gradient(circle at 75% 12%, rgba(216, 63, 135, 0.18), transparent 42%),
        radial-gradient(circle at 15% 80%, rgba(233, 128, 116, 0.15), transparent 38%);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.5;
    }

    .container {
      width: min(1100px, 92%);
      margin: 0 auto;
    }

    header {
      background: rgba(42, 27, 61, 0.5);
      backdrop-filter: blur(8px);
      position: sticky;
      top: 0;
      z-index: 10;
      padding: 0.75rem 0;
      border-bottom: 1px solid var(--border);
    }

    nav {
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    nav a {
      color: var(--text);
      text-decoration: none;
      transition: 0.2s ease;
      font-weight: 600;
    }

    nav a:hover {
      color: var(--accent);
    }

    main {
      padding: 3rem 0 3rem;
      display: grid;
      gap: 3rem;
      min-height: calc(100vh - 56px);
    }

    .agent-selector {
      display: grid;
      gap: 2rem;
      text-align: center;
    }

    .selector-title {
      font-size: 2.5rem;
      font-weight: 900;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: #dff876;
      text-shadow: 0 0 12px rgba(223, 248, 118, 0.4);
    }

    .agents-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(80px, 1fr));
      gap: 0.5rem;
      justify-items: center;
      padding: 1.5rem;
      background: var(--panel);
      border: 1px solid var(--border);
    }

    .agent-thumbnail {
      width: 80px;
      height: 80px;
      position: relative;
      overflow: hidden;
      border: 2px solid var(--border);
      background: rgba(0, 0, 0, 0.3);
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 0.7rem;
      color: var(--text);
      text-align: center;
      padding: 0.3rem;
    }

    .agent-thumbnail.with-image {
      padding: 0;
      background: rgba(0, 0, 0, 0.2);
    }

    .agent-thumbnail.with-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .agent-name {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.55);
      color: var(--text);
      font-weight: 700;
      font-size: 0.62rem;
      line-height: 1.2;
      padding: 0.2rem 0.25rem;
      text-align: center;
    }

    .agent-thumbnail:hover {
      border-color: var(--accent);
      background: rgba(216, 63, 135, 0.15);
      transform: scale(1.05);
    }

    .agent-thumbnail.selected {
      border-color: #dff876;
      background: rgba(223, 248, 118, 0.2);
      box-shadow: 0 0 12px rgba(223, 248, 118, 0.4);
    }

    .agent-thumbnail.has-lineup {
      border-color: #dff876;
    }

    .action-section {
      display: flex;
      justify-content: center;
      padding: 2rem 0;
    }

    .proceed-btn {
      padding: 1rem 2.5rem;
      font-size: 1.1rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      background: var(--accent);
      color: white;
      border: 1px solid var(--accent);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .proceed-btn:hover:not(:disabled) {
      filter: brightness(1.1);
      transform: translateY(-2px);
    }

    .proceed-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    footer {
      border-top: 1px solid var(--border);
      color: var(--muted);
      padding: 2rem 0 1.5rem;
      font-size: 0.85rem;
      text-align: center;
      margin-top: 2rem;
    }

    @media (max-width: 720px) {
      main {
        padding: 2rem 0;
      }

      .agents-grid {
        grid-template-columns: repeat(auto-fit, minmax(70px, 1fr));
      }

      .agent-thumbnail {
        width: 70px;
        height: 70px;
      }

      .selector-title {
        font-size: 1.8rem;
      }
    }
  </style>
</head>
<body>
  <header>
    <nav class="container">
      <a href="../../index.html">← Back to Home</a>
      <span id="mapTitle">Bind</span>
      <span></span>
    </nav>
  </header>

  <main class="container">
    <section class="agent-selector">
      <h1 class="selector-title">Select Agent</h1>
      <div class="agents-grid" id="agentsGrid"></div>
      <div class="action-section">
        <button class="proceed-btn" id="proceedBtn" disabled>Proceed</button>
      </div>
    </section>
  </main>

  <footer>
    <div class="container">VAL Code</div>
  </footer>

  <script>
    const mapName = 'Bind'; // Change this for each map page
    let selectedAgent = null;

    function resolveAgentImage(path) {
      if (typeof path !== 'string' || path.trim() === '') return null;
      if (path.startsWith('http://') || path.startsWith('https://')) return path;
      if (path.startsWith('/')) return `../..${path}`;
      return path;
    }

    async function loadAgents() {
      try {
        const response = await fetch('../../data/agents.json');
        const data = await response.json();
        const grid = document.getElementById('agentsGrid');
        const proceedBtn = document.getElementById('proceedBtn');

        data.agents.forEach(agent => {
          const thumbnail = document.createElement('div');
          thumbnail.className = 'agent-thumbnail';
          thumbnail.dataset.agentName = agent.name.toLowerCase();

          const imageSrc = resolveAgentImage(agent.image);
          if (imageSrc) {
            thumbnail.classList.add('with-image');
            thumbnail.innerHTML = `
              <img src="${imageSrc}" alt="${agent.name}" onerror="this.remove()" />
              <span class="agent-name">${agent.name}</span>
            `;
          } else {
            thumbnail.textContent = agent.name;
          }
          
          // Apply yellow border if agent has lineup
          if (agent.withLineUp) {
            thumbnail.classList.add('has-lineup');
          }
          
          thumbnail.addEventListener('click', () => {
            // Remove selection from all
            document.querySelectorAll('.agent-thumbnail').forEach(t => {
              t.classList.remove('selected');
            });
            // Add selection to clicked
            thumbnail.classList.add('selected');
            selectedAgent = agent.name.toLowerCase();
            proceedBtn.disabled = false;
          });

          grid.appendChild(thumbnail);
        });

        // Proceed button click handler
        proceedBtn.addEventListener('click', () => {
          if (selectedAgent) {
            window.location.href = `${selectedAgent}/`;
          }
        });

        document.getElementById('mapTitle').textContent = mapName;
      } catch (error) {
        console.error('Error loading agents:', error);
      }
    }

    document.addEventListener('DOMContentLoaded', loadAgents);
  </script>
</body>
</html>
